<!doctype html>
<html lang="es">
    <head>
        <!-- Juego de caracteres de casi todos los idiomas humanos (incluidos ñ, tildes ...) -->
        <meta charset="utf-8" />
        <!-- Escala inicial y renderizado _responsive_ por el ancho del dispositivo -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Compatibilidad con Microsoft Explorer -->
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Indéxame NO y sígueme NO -->
        <meta name="robots" content="noIndex, noFollow" />
        <!-- Breve descripción del sitio que se verá en los resultados de búsqueda -->
        <meta
            name="description"
            content="Sitio web de prueba elaborado en el curso de Confección y Publicación de Páginas Web (IFCD0110). Unidad Formativa UF1303, Elaboración de hojas de estilos"
        />

        <!-- Utilícese una hoja de estilos Normalize -->
        <link
            rel="stylesheet"
            href="https://necolas.github.io/normalize.css/latest/normalize.css"
        />

        <!-- Hojas de estilos de terceros -->

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- Hover.css de ianlunn.github.io -->
        <!-- <link rel="stylesheet" href="../assets/css/hover.css" /> -->

        <!-- Ruta a nuestras hojas de estilos -->
        <link rel="stylesheet" href="../assets/css/visibilidad.css" />
        <link rel="stylesheet" href="../assets/css/vars.css" />
        <link rel="stylesheet" href="../assets/css/transitions.css" />
        <link rel="stylesheet" href="../assets/css/images.css" />
        <link rel="stylesheet" href="../assets/css/carrousel.css" />

        <link rel="stylesheet" href="../assets/css/typografia.css" />
        <link rel="stylesheet" href="../assets/css/menu.css" />
        <link rel="stylesheet" href="../assets/css/formularios.css" />
        <link rel="stylesheet" href="../assets/css/estilos.css" />

        <!-- Título de la pestaña del navegador -->
        <title>UF1304 | Plantillas y formularios</title>
    </head>

    <body>
        <header>
            <a href="../index.html" class="no-border" title="Página principal">
                <figure class="logo"></figure>
                <h1 class="pechado">
                    Elaboración de hojas de estilos (UF1303)
                </h1>
            </a>
            <!-- Slogan -->
            <p class="pechado">
                Curso de Confección Publicación de Páginas Web
            </p>
        </header>

        <nav class="principal" aria-label="Navegación principal">
            <h2 class="pechado">Menú Principal</h2>
            <input id="icon-menu" name="icon-menu" type="checkbox" />
            <label
                for="icon-menu"
                class="icon-menu"
                aria-label="Abrir/Cerrar menú"
                >Menú</label
            >
            <ul>
                <li>
                    <a href="../index.html">Inicio</a>
                </li>
                <li>
                    <a href="#">Temas</a>
                    <ul>
                        <li>
                            <a href="textos.html">Textos</a>
                        </li>
                        <li>
                            <a href="imagenes.html">Imagenes</a>
                        </li>
                        <li>
                            <a href="temas/formularios.html">Imagenes</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="#">Nosotros</a>
                </li>
                <li>
                    <a href="#">Contacto</a>
                </li>
            </ul>
        </nav>

        <main class="agua">
            <section>
                <header class="img-before portada">
                    <h2>Contacta con nosotros</h2>
                </header>
                <article>
                    <h3>Formulario de Contacto</h3>

                    <form
                        action="enviado.html"
                        method="post"
                        class="form"
                        id="form"
                    >
                        <fieldset>
                            <legend>Formulario de Contacto</legend>
                            <ul>
                                <li>
                                    <label for="name">Nombre</label>
                                    <!-- pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]{3,50}" -->
                                    <!-- title="Sólo se admiten letras del alfabeto español y espacios en blanco" -->
                                    <input
                                        type="text"
                                        placeholder="Tu nombre"
                                        name="name"
                                        id="name"
                                        required
                                    />
                                </li>
                                <li>
                                    <label for="email">E-mail</label>
                                    <input
                                        type="email"
                                        placeholder="Correo electrónico"
                                        name="email"
                                        id="email"
                                        required
                                    />
                                </li>
                                <li>
                                    <label for="tfno">Teléfono</label>
                                    <input
                                        type="text"
                                        placeholder="Teléfono"
                                        name="tfno"
                                        id="tfno"
                                    />
                                </li>
                                <li>
                                    <label for="edad">Edad</label>
                                    <input
                                        type="number"
                                        placeholder="Edad"
                                        id="edad"
                                        name="edad"
                                    />
                                </li>
                                <li class="radio">
                                    <input
                                        type="radio"
                                        name="genero"
                                        value="h"
                                        id="hombre"
                                    />
                                    <label for="hombre">Hombre</label>
                                </li>
                                <li class="radio">
                                    <input
                                        type="radio"
                                        name="genero"
                                        value="m"
                                        id="mujer"
                                    />
                                    <label for="mujer">Mujer</label>
                                </li>
                                <li>
                                    <input
                                        type="checkbox"
                                        name="acepto"
                                        id="acepto"
                                    />
                                    <label for="acepto"
                                        >Acepto el tratamiento de mis datos
                                        personales. Más información en
                                        <a href="#"
                                            >Política de tratamiento de datos
                                            personales</a
                                        >
                                    </label>
                                </li>
                                <li class="textarea">
                                    <label for="mensaje">Mensaje</label>
                                    <textarea
                                        placeholder="Escribe tu mensaje aquí"
                                        name="mensaje"
                                        id="mensaje"
                                        cols="30"
                                        rows="5"
                                        required
                                    ></textarea>
                                </li>
                            </ul>
                        </fieldset>
                        <p id="errores"></p>

                        <ul class="enviar">
                            <li>
                                <input
                                    type="submit"
                                    value="Enviar"
                                    id="enviar"
                                />
                            </li>
                            <li>
                                <input type="reset" value="Borrar" />
                            </li>
                        </ul>
                    </form>
                </article>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
