<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

            content="Sitio web de prueba elaborado en el curso de Confección y Publicación de Páginas Web (IFCD0110). Unidad Formativa UF1305, Programación con lenguajes de guión en páginas web" />

        <!-- Utilícese una hoja de estilos Normalize -->
        <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css" />

        <!-- Hojas de estilos de terceros -->

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet" />

        <!-- Ruta a nuestras hojas de estilos -->
        <link rel="stylesheet" href="../assets/css/visibilidad.css" />
        <link rel="stylesheet" href="../assets/css/vars.css" />
        <link rel="stylesheet" href="../assets/css/transitions.css" />
        <link rel="stylesheet" href="../assets/css/images.css" />
        <!-- <link rel="stylesheet" href="../assets/css/carrousel.css" /> -->

        <link rel="stylesheet" href="../assets/css/typografia.css" />

        <link rel="stylesheet" href="../assets/css/formularios.css" />
        <link rel="stylesheet" href="../assets/css/footer.css" />
        <link rel="stylesheet" href="../assets/css/estilos.css" />
        <link rel="stylesheet" href="../assets/css/mario-bross-01.css" />

        <script src="../assets/js/mario-bros-01.js" defer></script>

        <!-- Título de la pestaña del navegador -->
        <title>JavaScript y el DOM con Mario Bros | UF1305</title>
    </head>

    <body class="jsMario">
        <header id="header"></header>
        <nav id="menu" class="principal" aria-label="Navegación principal"></nav>
        <main class="agua">
            <section class="marioClass">
                <header class="img-before portada">
                    <h2>Aprende JavaScript con Mario</h2>
                </header>
                <article class="game">
                    <h3>Escenario de Mario</h3>
                    <div id="escenario" class="escenario">
                        <figure class="mario" id="mario">
                            <img src="../assets/img/super-mario-bross.webp" alt="Mario Bros" draggable="false" />
                            <figcaption>Mario</figcaption>
                        </figure>
                    </div>
                </article>
                <article id="galeria-mario">
                    <h3>Galería de Mario</h3>
                    <output id="info" class="info">¡Listo! Mario está esperando órdenes.</output>
                    <ul class="galeria">
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="img-before">
                                <figcaption></figcaption>
                            </figure>
                        </li>
                    </ul>
                </article>
            </section>
        </main>

        <footer id="footer"></footer>
    </body>

    <script type="module">
        async function includeHTML(selector, url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Error cargando ${url}: ${response.status}`);
            }

            document.querySelector(selector).innerHTML = await response.text();
        }

        await Promise.all([
            includeHTML("#header", "../layouts/header.html"),
            includeHTML("#menu", "../layouts/menu.html"),
            includeHTML("#footer", "../layouts/footer.html"),
        ]);
    </script>
</html>
